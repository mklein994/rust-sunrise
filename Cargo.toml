[package]
name = "sunrise"
version = "1.2.1"
authors = ["Nathan Osman <nathan@quickmediasolutions.com>"]
description = "Sunrise and sunset calculator"
repository = "https://github.com/nathan-osman/rust-sunrise"
readme = "README.md"
categories = ["date-and-time", "no-std"]
license = "MIT"
edition = "2024"

[lib]
name = "sunrise"

[features]
no-std = ["dep:libm"]
default = ["chrono"]
chrono = ["dep:chrono"]
jiff = ["dep:jiff"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = [], optional = true }
jiff = { version = "0.2", default-features = false, features = [], optional = true }

# feature: no-std
libm = { version = "0.2", optional = true }

[dev-dependencies]
approx = "0.5"
